<div class="visual-bin" data-bin-kind="{{ kind }}">
    <div class="visual-bin-scene" aria-hidden="true">
        <span class="visual-bin-item"></span>
        <div class="visual-bin-lid"></div>
        <div class="visual-bin-body">
            <span class="visual-bin-symbol">{{ symbol }}</span>
            <svg viewBox="0 0 40 40" fill="none"><path d="m15 12 5-8 7 12m-5-1 5 1 2-5M29 21l5 9H20m3-4-3 4 3 4M14 30H5l7-12m1 5-1-5-5 1" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span class="visual-bin-shadow"></span>
    </div>
    <strong data-en="{{ english }}">{{ arabic }}</strong>
    <span class="visual-bin-state" data-en="Closed">مغلقة</span>
</div>
